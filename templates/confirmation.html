<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmed — hermes-sandbox</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      margin: 0; padding: 2rem 1rem; display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 40rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid #8883; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .total { font-weight: 600; font-size: 1.15rem; }
    .order-ref { color: #555; margin-bottom: 1rem; }
    .empty-msg { font-size: 1.1rem; color: #888; }
  </style>
</head>
<body>
<main data-testid="confirmation-panel">
  {% if empty %}
    <p class="empty-msg" data-testid="empty-cart-message">Your cart is empty</p>
  {% else %}
    <h1 data-testid="confirmation-heading">Order confirmed</h1>
    <p class="order-ref" data-testid="order-ref">{{ order_ref }}</p>

    <table data-testid="order-items">
      <thead>
        <tr><th>Item</th><th class="num">Qty</th><th class="num">Line total</th></tr>
      </thead>
      <tbody>
        {% for item in line_items %}
        <tr data-testid="order-row">
          <td data-testid="order-item-name">{{ item.name }}</td>
          <td class="num" data-testid="order-item-qty">{{ item.quantity }}</td>
          <td class="num" data-testid="order-item-total">£{{ '%.2f'|format(item.line_total) }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <p class="total" data-testid="amount-paid">
      Amount paid: <span data-testid="amount-paid-value">£{{ '%.2f'|format(amount_paid) }}</span>
    </p>
  {% endif %}
</main>
</body>
</html>
